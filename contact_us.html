  <!-- ========== CONTACT US CONTENT ========== -->
  <main id="main-content">
    <section class="contact" aria-label="Contact us">
      <!-- Background -->
      <div class="contact__bg">
        <img
          src="./images/hero-bg.jpg"
          alt="City skyline background"
          loading="eager"
          decoding="async"
          width="1920"
          height="1080"
          onerror="this.onerror=null; this.src='./images/placeholder.jpg';"
        >
      </div>
      <div class="contact__overlay"></div>

      <div class="contact__content">
        <!-- Left: Title & subtitle -->
        <div class="contact__info">
          <h1 class="contact__title">Contact Us</h1>
          <p class="contact__subtitle">Get in touch</p>
        </div>

        <!-- Right: Form -->
        <form id="contact-form" class="contact__form" novalidate>
          <div class="form-group">
            <label for="contact-name">Name</label>
            <input
              type="text"
              id="contact-name"
              name="name"
              placeholder="Your name"
              autocomplete="name"
              required
            >
            <span class="form-error" id="name-error" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="contact-email">Email</label>
            <input
              type="email"
              id="contact-email"
              name="email"
              placeholder="your@email.com"
              autocomplete="email"
              required
            >
            <span class="form-error" id="email-error" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="contact-message">Message</label>
            <textarea
              id="contact-message"
              name="message"
              placeholder="Your message"
              rows="5"
              required
            ></textarea>
            <span class="form-error" id="message-error" role="alert"></span>
          </div>

          <button type="submit" class="contact__submit">Submit</button>

          <!-- Success message -->
          <div id="contact-success" class="contact__success" role="status">
            Thank you! Your message has been sent successfully.
          </div>
        </form>
      </div>
    </section>
  </main>
